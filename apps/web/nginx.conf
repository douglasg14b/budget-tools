# nginx config for the Budget Tools web SPA.
#
# Two jobs: serve the built Vite bundle with a history fallback, and reverse-proxy `/api` to the
# API container. The proxy is mandatory, not a convenience — the web client's base URL is a
# hardcoded relative `/api` (apps/web/src/configureApiClient.ts), so same-origin is the contract.

# MIME types nginx's stock mime.types does not cover. It already maps `.wasm` to application/wasm
# (re-declaring that is a startup warning), but it predates `.mjs` and `.webmanifest` and knows
# nothing about `.ort`.
#
# `.mjs` is the one that breaks things: ONNX Runtime loads its WASM backend by dynamically
# importing ort-wasm-simd-threaded.mjs. Browsers enforce a strict MIME check on ES module imports
# and refuse to execute a module served as application/octet-stream, which surfaces as
# "failed to fetch dynamically imported module" and then ORT's "No available backend found".
#
# `.ort` is the serialized model, fetched as bytes rather than executed, so octet-stream is right.
types {
    text/javascript            mjs;
    application/manifest+json  webmanifest;
    application/octet-stream   ort;
}

server {
    # TLS only. Nothing that crosses the wire outside the Docker network is plaintext: Caddy
    # terminates the public certificate and re-encrypts to this listener. The certificate here is
    # self-signed and generated at container start, so Caddy must use `tls_insecure_skip_verify` —
    # that skips identity validation, not encryption.
    listen 8443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /tls/tls.crt;
    ssl_certificate_key /tls/tls.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # Resolve the `api` upstream at request time, not at startup. Without this nginx refuses to
    # boot when the API container is not yet up ("host not found in upstream"), so a restart of
    # the API would crash-loop the web container. 127.0.0.11 is Docker's embedded DNS.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream "api:4020";

    root /usr/share/nginx/html;
    index index.html;

    # Receipt frames are posted as data URLs; keep this in step with RECEIPTS_JSON_BODY_LIMIT
    # (15 MiB) plus base64 overhead, otherwise nginx 413s before the API ever sees the request.
    client_max_body_size 25m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location /api/ {
        # The variable in proxy_pass is what defers DNS resolution to request time (see resolver
        # above). With a variable, nginx no longer rewrites the URI, so $request_uri is explicit.
        #
        # https, even though this hop stays inside the Docker bridge: the requirement is that no
        # plaintext leaves the network, and keeping the whole chain uniform means a future move of
        # the API to another host cannot silently downgrade it.
        proxy_pass https://$api_upstream$request_uri;

        # The API's certificate is self-signed and regenerated per boot, so there is nothing stable
        # to verify against. Encryption is the goal; identity is established by the Docker network.
        proxy_ssl_verify off;
        proxy_ssl_server_name on;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Receipt extract and categorization scoring are slow by design (LLM + ML round trips).
        # The API's own timeout is 300s; outlast it so nginx is never the one to cut the request.
        proxy_connect_timeout 60s;
        proxy_send_timeout 310s;
        proxy_read_timeout 310s;
    }

    # Content-hashed bundle assets are safe to cache forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # The HTML shell contains the content-hashed asset URLs for the current release. It must be
    # revalidated on every navigation so a deployment cannot leave a browser pointing at an old
    # bundle. The exact-match location also handles internal redirects from the SPA fallback below.
    location = /index.html {
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
    }

    # Browsers revalidate these files to discover new app metadata and service-worker releases.
    location = /manifest.webmanifest {
        expires -1;
        add_header Cache-Control 'no-cache' always;
    }

    location = /sw.js {
        expires -1;
        add_header Cache-Control 'no-cache' always;
    }

    location = /registerSW.js {
        expires -1;
        add_header Cache-Control 'no-cache' always;
    }

    # SPA history fallback: unknown paths are client-side routes, so hand back index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
